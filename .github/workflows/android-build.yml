name: Android Build

# 触发：推送到 main 或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;26.1.10909125" || true
          yes | sdkmanager --licenses || true
        env:
          ANDROID_HOME: $ANDROID_HOME
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT

      - name: Generate development keystore
        # 仓库里不存签名文件；CI 用一次性自签 keystore 完成 release 签名
        run: |
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias ktv -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ktv123456 -keypass ktv123456 \
            -dname "CN=KTV Dev, OU=Dev, O=Dev, L=City, S=State, C=CN"
          printf 'storeFile=release.keystore\nstorePassword=ktv123456\nkeyAlias=ktv\nkeyPassword=ktv123456\n' > android/keystore.properties

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
