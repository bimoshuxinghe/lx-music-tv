name: Build TV Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9123335
          packages: |
            platform-tools
            build-tools;35.0.0
            platforms;android-35
            ndk;26.1.10909125
            licenses

      - name: Setup keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<'KEYSTORE'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          KEYSTORE

      - name: Create local.properties
        working-directory: android
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties
          echo "ndk.dir=${{ env.ANDROID_NDK_HOME }}" >> local.properties

      - name: Build Release APK (armeabi-v7a)
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lx-music-tv-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
